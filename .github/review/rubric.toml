# The review bot's rubric (CI-3). One [[item]] per checkbox the bot ticks in the pull request's
# "Agent review" section. The bot runs from Aptix-Bio/governance at the commit
# .github/workflows/review.yml pins, and loads this file, the files it names and
# .github/CODEOWNERS from the default branch's commit, never from the pull request under review,
# so a pull request cannot change the rules it is judged by.
#
# An item passes, fails, or does not apply. A failed item with blocking = true fails the
# `code-review` check; a failed advisory item is reported only. Changing this file changes what
# every later pull request is held to: it is a code-owner file (.github/CODEOWNERS) and its own
# pull request says why.
#
# Since 2026-11-27 (development/ARCHITECTURE.md, D25 amended) the family's general conventions,
# the shared items and this repository's plans are kept privately, and the bot reads them from its
# own read-only checkout: `shared_reference_files` and `shared_items` name the conventions and the
# items by file name and ID, `plan_reference_files` this repository's plans by file name, and
# `[trace]` `plan_ticks` and `plan_rows` the plan files whose ticks and rows must link their work
# commits. The bot resolves each name under its checkout, so this file carries no path into it
# (cmake/check_review_configuration.cmake requires a bare file name).

[review]
product = "Iris-File-Extension (IFE), the public specification of the Iris slide file format and the C++20 library generated from it that reads, writes, validates and recovers those files, MIT-licensed"
# This repository's own documents, read whole from the default branch; a missing one fails the
# review by name. development/ holds the design (development/README.md): the layering, block
# governance and decisions (ARCHITECTURE.md) and the pipeline rules (PIPELINE.md).
# CONTRIBUTING.md holds the append-only wire contract and the code rules; CLAUDE.md the design
# notes; spec/ the format itself, whose JSON documents are the single source of truth for the
# generated code; generator/README.md and tests/wire/README.md the drift gate and its witness.
reference_files = [
    "development/README.md",
    "development/ARCHITECTURE.md",
    "development/PIPELINE.md",
    "CONTRIBUTING.md",
    "CLAUDE.md",
    "spec/README.md",
    "spec/ife_header.json",
    "spec/ife_fields.json",
    "spec/ife_constants.json",
    "generator/README.md",
    "tests/wire/README.md",
]
# The family's general conventions, sent whole before this repository's documents.
shared_reference_files = ["style_guide.md", "ci_runners.md", "planning.md", "public_repositories.md"]
# The shared items this repository is held to, in the shared order; its own items (SpecLedger,
# ByteOrderAndPortability) follow them. ClinicalIntegrity is not selected while it is an open
# question whether IFE, which writes the clinical stream, takes it.
shared_items = [
    "Traceability",
    "StyleGuide",
    "MinimumSurface",
    "TestsFirst",
    "AbiAndConsumers",
    "PublicRepository",
    "SecurityImpact",
    "Pipeline",
    "DataProtection",
    "Documentation",
    "AgentDisclosure",
]
# This repository's work breakdown and requirements, sent whole: the bot's excerpt mechanism
# matches only `PascalCaseName_<n>` IDs, which most of IFE's (`CI-3.6`, `RB-5`) are not, so an
# excerpt would drop the items a pull request names. IFE keeps no errata file.
plan_reference_files = ["WBS.md", "RTM.md"]

# What is particular to this repository, appended to each shared item's guidance.
[shared_guidance]
Traceability = """
IFE's work items keep the IDs they were filed under: a series, a package number and a step
(`CI-2.4`, `VL-1.1`, `RC-10`), or a spelled-out name and number (`ReviewRubric_1`); a series ID
filed before the spelled-out rule is no abbreviation finding. The branch is named
`<kind>/<WorkPackage>_<n>` after one of the items. A change to code, the specification, the
generator or a workflow whose description names no work item fails (development/README.md,
update rule).
"""
StyleGuide = """
IFE's own rules are CONTRIBUTING.md, "The code rules". In this codebase the common failures also
include: a walk over the block graph written as recursion instead of a loop over an explicit
queue; a file mapping without an RAII owner; a public function that does not return an
`Iris::Result` under `Domain::IRIS_FILE_EXTENSION` or whose body does not run inside
`boundary()` (src/IFE_Failure.hpp); a value returned other than through the last, non-`const`
reference parameter; a `switch` over an enumeration with `default:` (CLAUDE.md, Warnings); a bare
number where a generated constant or scoped enumeration from spec/ belongs; an object made from a
descriptor other than by `create_<name>(const <Name>Desc&, <Name>&)`.
"""
MinimumSurface = """
Offsets, sizes, recovery tags and enumeration values are derived from spec/*.json by the
generator; a hand-written copy of one in src/, include/ or tests/ fails. The vocabulary
Iris-Headers provides (Result, Buffer, Memory and the rest) is reused, never re-implemented. IFE
defines byte structure only: compression, decompression, colour handling and anything that
interprets a tile stream belong to Iris-Slide (CLAUDE.md, "Tile stream contents are not this
library's business") and fail here. One reading is allowed: a reader that takes syntax elements
from a tile stream's own header (an AV1 sequence header) to check that they agree with IFE's
blocks, where each agreement is an entry of the schema's `external_check` section in
spec/ife_fields.json and its comparison is generated from it (decided 2026-11-26, D31). Such a
reader walks the stream only as far as the elements the section names. Code that decodes or
transforms tile pixel data, converts its colour, or checks a rule of the stream's own that no IFE
field states still fails. A new public header, exported symbol or build option is justified in
the description.
"""
TestsFirst = """
A test here is a C++ test under tests/ registered in both tests/tests.cmake and tests/tests.bzl
(development/PIPELINE.md, rule 4), a generator test under tests/generator/, a lint under tools/,
or a `cmake -P` check under cmake/. "Red first" shows the failing run at its commit. A test that
records existing behaviour may never have been red; the description says so.
"""
AbiAndConsumers = """
IFE depends on Iris-Headers and on nothing else first-party: a line that makes IFE include, link,
fetch or call Iris-Slide (or any codec) fails, because Iris-Slide is IFE's consumer and the
boundary is why the two repositories are separate. "Consumer impact" states what Iris-Slide and
any other consumer must change. The `downstream` CI job (Iris-Slide built against this branch) is
green, or the change is coordinated: the description names each consumer's pull request and the
order in which they merge, since merging IFE first breaks the consumer's `main`. A change that
needs an unreleased Iris-Headers change names that pull request and merges after it.
"""
PublicRepository = """
Iris-File-Extension is public under MIT (its specification under CC BY-ND 4.0). Two names are
allowed where they are needed: Aptix-Bio/governance, as the private source of the review bot in
.github/ and the documents describing the review; and the licensed codec, named only as a library
that licensees load at runtime. The open-source slide library is Iris-Slide (renamed 2026-11-24);
a line written after the rename does not call it Iris-Codec. A line that only keeps a name already
on the line it edits is judged as it was. The family's plans and general conventions are kept
privately: a public text refers to them only as such, naming no repository, path or private
file, and a line that cites a removed development/ plan or rule file fails.
"""
SecurityImpact = """
IFE parses untrusted files: new parsing of a file, a byte window or a network fetch bounds every
offset and length against the mapped size before it is used, and a block is used only after its
`validate()` passes (CLAUDE.md, "The read path"); the recovery scan treats every byte as hostile.
A new dependency is under a permissive licence (MIT, BSD, Apache-2.0, BSL-1.0, Zlib, ISC) and
pinned by version and hash.
"""
Pipeline = """
Applies to changes under .github/, cmake/, tools/ or CMakePresets.json that touch CI, judged also
against development/PIPELINE.md. Every job has a documented Blacksmith label
(`tools/runner_labels_lint.py`); a `run:` step is one `cmake --preset`, `cmake --workflow` or
`cmake -P cmake/<name>.cmake` command; a job that needs a setting checks it first
(cmake/require_settings.cmake); cmake/check_review_configuration.cmake holds review.yml's
properties. Older jobs in ci.yml that predate these rules are judged only on the lines the diff
changes.
"""
DataProtection = """
Corpus fixtures are hosted and pinned by SHA-256 in tests/corpus/manifest.json and never
committed, and test slides are built by the tests with tile streams of filler bytes.
"""
Documentation = """
A change to the format updates spec/ife_spec.adoc's prose where the generated tables do not carry
it. A decision that changed is recorded, dated, as an amendment in development/ARCHITECTURE.md §1.
README.md stays true to how a consumer fetches, builds and links IFE, and its examples still
compile (tests/readme/).
"""

[trace]
# Every new WBS tick, and every RTM row moved to these statuses, links to the GitHub commit that
# did the work (`- [x] CI-2.1 **Title.** evidence [1234567](.../commit/<full hash>)`, or the
# link in the row's status cell); a line that does not fails `item`. Checked by the bot itself,
# without the model. The ticks and rows are in this repository's private plans (plan_ticks,
# plan_rows), so this repository's own files carry none (ticks, rows).
item = "Traceability"
ticks = []
rows = []
row_statuses = ["Implemented", "Verified"]
plan_ticks = ["WBS.md"]
plan_rows = ["RTM.md"]

[verification]
# One maintainer: the pull request's author may give the final human verification until a second
# maintainer joins.
allow_author = true

# This repository's own items, after the shared ones.

[[item]]
id = "SpecLedger"
title = "Specification ledger: spec/*.json changes are append-only, the wire witness is refreshed in the same change, and nothing generated is hand-edited or committed"
blocking = true
guidance = """
spec/ife_header.json, spec/ife_fields.json and spec/ife_constants.json are the single source of
truth for the wire (spec/README.md; CONTRIBUTING.md, "The absolutes"). A change to them is
append-only: a field, block, enumeration member or constant already in a version group is never
moved, resized, retyped, renamed, reordered or removed; new facts arrive only as a new
`ife_version` group, a new field at the end of a group, a new block with the next recovery tag, or
a new member; a recovery-tag value is never written by hand; a member is retired only with
`deprecated` (version and reason) and keeps its value. A diff that edits a shipped fact fails,
whatever the generator's gate says. A spec addition refreshes tests/wire/witness.json in the same
pull request (`python3 tools/refresh_witness.py`); a witness change without a matching spec change,
or one that alters a shipped fact rather than adding one, fails unless the description justifies
it as a reviewed wire correction recorded in tests/wire/README.md. Generated output matches the
generator: generated_source/ and generated_docs/ are produced by `python3 generate_IFE.py` at
configure into the build tree, never in the source tree, and are never hand-edited or committed
(fix the emitter in generator/emit/ instead). The spec job proves it with `--validate` (consistency
and the append-only gate against the committed witness), a regeneration, and `--check` (every
generated file's banner witness hash matches the current spec, and the witness is not stale); the
description's test results show that job green. A ratified version's corpus fixture is never
rewritten (CONTRIBUTING.md, "What a wire change requires"). A diff that touches none of spec/,
generator/, tests/wire/ or the generated directories: not applicable.
"""

[[item]]
id = "ByteOrderAndPortability"
title = "Byte order and portability: little-endian on disk on every host, through IFE_Bytes; the s390x job and the portability lint stay green"
blocking = true
guidance = """
IFE stores every multi-byte value little-endian on disk at every version (spec/ife_spec.adoc;
include/IFE_Bytes.hpp), which is a claim about every host. New code that reads or writes the file
goes through the IFE_Bytes loads and stores or the generated handles; a `memcpy`,
`reinterpret_cast` or pointer cast of file bytes into a multi-byte integer, or a check of the
host's byte order outside IFE_Bytes, fails. The `big-endian (s390x)` CI job (`cmake --workflow
--preset big-endian`: an s390x cross build whose every test binary runs under qemu-s390x, with
`ife_host_byte_order_tests` failing unless the binaries execute big-endian) stays green, and a
change to that job, its preset or cmake/toolchains/ keeps every test running emulated. The
portability lint (`python3 tools/portability_lint.py`, in the spec job) stays green: no Windows
SDK macro as a name, no Windows path through a string literal, every public header declared to
Bazel. Code that builds on one of GCC, Clang, AppleClang, MSVC and Emscripten but not the others
fails. Not applicable when the diff touches no C++, build file or byte-handling test.
"""
