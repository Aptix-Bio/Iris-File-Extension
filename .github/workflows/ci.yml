name: CI

# The gates, in one place. Eight jobs, each pinning a
# property nothing else can:
#
#   spec        the JSON is self-consistent, and the generated layer is what
#               the current spec produces (the drift gate)
#   tests       the generated layer and the primitives behave -- including the
#               v1 oracle, the only test that reads bytes the shipped encoder
#               wrote rather than another description of the format. Run on
#               GCC, Clang, AppleClang, MSVC, and under the Xcode generator,
#               because an include that one toolchain resolves transitively is
#               a bug on the others, and because the Xcode generator names the
#               compiler the raw toolchain `clang++`, an identity no other leg
#               presents (see the matrix note).
#   bazel       the Bazel build and its twelve tests, on the default
#               toolchain AND MSVC -- the only job that exercises the
#               /std:c++20 select and the IRIS_EXPORT= dllimport
#               neutralization the Bazel rules need on Windows. The test
#               rules live in tests/tests.bzl (ife_tests), loaded by
#               BUILD.bazel
#   downstream  Iris-Slide (the primary consumer) builds against THIS branch
#               via a FetchContent source override -- the check that a change
#               here does not break the ecosystem that depends on it
#   sanitizers  the packed loads read exactly 3 and exactly 5 bytes. Without
#               ASan those tests are ordinary passing round-trips and prove
#               nothing
#   wasm        the project's only __EMSCRIPTEN__ branch. Every native build
#               takes the other side of that #if, so without this job the
#               ranged-fetch path is never compiled at all
#   document    the specification renders: a schema change that breaks it
#               fails here rather than at publication
#   big-endian  IFE is little-endian on disk at every version, which is a
#               claim about every host, not about the one you build on
#
# The pattern across the last three: a branch no developer machine executes is
# a branch no test can check, so each gets a job rather than a comment.
#
# Runners (CI-1 in development/WBS.md, decided 2026-11-24): every job runs on a
# Blacksmith runner at a label documented in
# https://docs.blacksmith.sh/blacksmith-runners/overview (read 2026-11-24),
# pinned to the OS version the -latest label ran:
#   Linux    blacksmith-2vcpu-ubuntu-2404   2 vCPU, 8 GB
#   Windows  blacksmith-2vcpu-windows-2025  2 vCPU, 7 GB; public beta, with
#            Visual Studio Build Tools 2022 in place of the full IDE
#   macOS    blacksmith-6vcpu-macos-26      Apple M4; GitHub's macos-26 image
# CMAKE_BUILD_PARALLEL_LEVEL sets the compile jobs to the runner's vCPU count;
# a bare -j under Makefiles starts every compile at once.
# tools/runner_labels_lint.py, run by the spec job, fails on any other label.

on:
  push:
    branches: [main, 'spec/**']
  pull_request:

jobs:
  spec:
    name: spec documents and drift
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Every job on a pinned Blacksmith runner
        run: python3 tools/runner_labels_lint.py
      # CI-3: review.yml runs under pull_request_target with the model key;
      # this fails a change that would let it check out or run a pull
      # request's code, widen a job's token, or move a secret.
      - name: The review bot's workflow stays safe under pull_request_target
        run: cmake -P cmake/check_review_configuration.cmake
      - run: python3 generate_IFE.py --validate
      - run: python3 generate_IFE.py
      - run: python3 generate_IFE.py --check
      # Determinism (XP-3): two generator runs must be byte-identical. The
      # seeds are the point — dict/set iteration order varies with
      # PYTHONHASHSEED, which is where non-determinism enters. ctest covers
      # the default environment; the seeds run here.
      - name: Generator determinism (seed 0)
        run: PYTHONHASHSEED=0 python3 tests/generator/test_determinism.py
      - name: Generator determinism (seed 1)
        run: PYTHONHASHSEED=1 python3 tests/generator/test_determinism.py
      - name: generate_IFE.py runs from any directory; -d names the root
        run: python3 tests/generator/test_directory_flag.py
      - name: Retired enum members are validated, emitted and off the wire
        run: python3 tests/generator/test_deprecated.py
      # Runs here rather than in the MSVC job so a Windows-only defect fails
      # in twenty seconds on Linux instead of after a full matrix build. It
      # replaces none of that job; it just gets there first.
      - name: Portability lint
        run: python3 tools/portability_lint.py

  tests:
    name: build and test (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: blacksmith-2vcpu-ubuntu-2404, jobs: 2, compiler: GCC}
          - {os: blacksmith-2vcpu-ubuntu-2404, jobs: 2, compiler: Clang, cxx: clang++}
          - {os: blacksmith-6vcpu-macos-26, jobs: 6, compiler: AppleClang}
          # AppleClang via Makefiles names the driver `c++`; the Xcode generator
          # names it the raw toolchain binary `.../usr/bin/clang++`. That is a
          # different identity to anything above: it is what a tool that
          # classifies the compiler by name sees, and the only config whose
          # driver is a toolchain binary with no SDK default. Both facts bit
          # the README gate (tests/readme/readme_compiles.py), and neither
          # AppleClang leg here nor any Linux leg can reproduce them.
          - {os: blacksmith-6vcpu-macos-26, jobs: 6, compiler: Xcode, generator: Xcode}
          - {os: blacksmith-2vcpu-windows-2025, jobs: 2, compiler: MSVC}
    steps:
      - uses: actions/checkout@v7
      # .deps/corpus is fetched from examples.iris.aptix.bio at configure (see
      # tools/fetch_corpus.py); cache it by manifest digest so a fresh runner
      # never touches the external host — the fetch script's own guarantee.
      - uses: actions/cache@v6
        with:
          path: .deps/corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}
      # MSVC locates its standard headers through INCLUDE, which the Windows
      # runner does not set: the build's MSBuild invocation carries it per
      # project, but the README gate spawns cl itself at test time and, without
      # it, cannot find <cstddef>. Establish the developer environment for the
      # whole job — configure, build and test then all see the same toolchain.
      - name: Set up the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # The configuration is named three times on purpose. Visual Studio is a
      # multi-config generator: it ignores CMAKE_BUILD_TYPE and picks a
      # configuration when it builds and again when it tests. Omit --config
      # and it silently builds Debug; omit ctest -C and every test reports
      # "Test not available without configuration" and counts as a failure,
      # which is what this job did. Makefiles and Ninja ignore the two flags
      # and honour the cache variable instead, so naming all three is what
      # makes one line work on every runner.
      - name: Configure
        run: >
          cmake -B build -DIFE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.generator && format('-G {0}', matrix.generator) || '' }}
          ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  bazel:
    name: bazel build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, blacksmith-2vcpu-windows-2025]
    steps:
      - uses: actions/checkout@v7
      # MODULE.bazel resolves Iris-Headers via local_path_override
      # ../Iris-Headers (the sibling-checkout layout of local development);
      # CI materializes exactly that layout. Plain git, not actions/checkout:
      # checkout@v4 rejects a `path:` outside the workspace ("Repository path
      # ... is not under ..."). The repo is public, so no token is needed.
      # The clone prefers this owner's Iris-Headers fork, so a fork's CI builds
      # against the fork's headers -- the same insulation the CMake fetch gives,
      # and required here: the Org's Iris-Headers still lacks the Memory rename
      # this branch depends on. Owners without a headers fork fall back to the
      # upstream org.
      - name: Check out Iris-Headers beside the main repo
        shell: bash
        run: |
          if git clone --depth 1 "https://github.com/${{ github.repository_owner }}/Iris-Headers.git" ../Iris-Headers; then
            echo "using ${{ github.repository_owner }}/Iris-Headers"
          else
            echo "no usable ${{ github.repository_owner }}/Iris-Headers" \
                 "(any clone error above is expected) - falling back to Aptix-Bio"
            rm -rf ../Iris-Headers
            git clone --depth 1 https://github.com/Aptix-Bio/Iris-Headers.git ../Iris-Headers
          fi
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Explicit bash: PowerShell mangles the // in target patterns on
      # Windows (documented setup-bazel Windows issue).
      # --verbose_failures: a failing genrule's command line and output must
      # reach the log — the runner truncates the bare action summary line.
      # --action_env=PATH: Bazel's strict action env strips PATH to
      # Git+system dirs on Windows, so genrules would find no python at all
      # (observed in the corpus genrule's `SET PATH=...`); inherit the
      # runner PATH instead. CI-only, no effect on production builds.
      - name: Build and test
        shell: bash
        run: bazel test //... --test_output=errors --verbose_failures --action_env=PATH

  downstream:
    name: Iris-Slide builds against this branch
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v7
      # Iris-Slide takes IFE as a vcpkg port pinned by commit, so this job
      # builds it through Iris-Slide's own scripts/local_ports.cmake, whose
      # overlay port's source is THIS checkout: the exact state the PR would
      # ship. Until R-8 (2026-11-25) it passed a FETCHCONTENT_SOURCE_DIR
      # override, which Iris-Slide's configure reported unused, and built the
      # pinned commit instead. Iris-Slide is cloned at the branch named like
      # this pull request's head when it has one (a coordinated change, as
      # Iris-Headers' downstream verdict pairs them), else main; the owner's
      # fork is preferred, so a fork tests its own consumer. The script holds
      # the logic (cmake/downstream_iris_slide.cmake); the branch name is text
      # the author chose, so it reaches it through env:.
      # Build-only, matching Iris-Slide's own CI (which runs no ctest). nasm
      # (for the aom port) and pkg-config are the system tools Iris-Slide's
      # .github/workflows/_build.yml installs because vcpkg cannot fetch them
      # on Blacksmith's Linux runners.
      - name: Configure Jpeg-Turbo PPA
        run: |
          sudo wget -q https://packagecloud.io/dcommander/libjpeg-turbo/gpgkey -O /etc/apt/trusted.gpg.d/libjpeg-turbo
          sudo gpg --dearmor /etc/apt/trusted.gpg.d/libjpeg-turbo
          sudo wget https://raw.githubusercontent.com/libjpeg-turbo/repo/main/libjpeg-turbo.list -O /etc/apt/sources.list.d/libjpeg-turbo.list
          sudo apt update
      - name: Fetch Dependencies
        run: sudo apt install libhwy-dev libjpeg-turbo-official libavif-dev libpng-dev zlib1g-dev openslide-tools python3-dev meson ninja-build nasm pkg-config -y
      - name: Iris-Slide (its paired branch, else main) built against this checkout
        env:
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
        working-directory: ..
        run: cmake -DIFE="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/cmake/downstream_iris_slide.cmake"

  sanitizers:
    name: address and undefined behaviour
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v7
      # Corpus cache as in the tests job: fresh runners must not hit the
      # external host for the two pinned fixtures.
      - uses: actions/cache@v6
        with:
          path: .deps/corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}
      - name: Configure with ASan + UBSan
        run: >
          cmake -B build-asan -DIFE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-asan
      - run: ctest --test-dir build-asan --output-on-failure

  document:
    name: specification document
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: gem install asciidoctor asciidoctor-pdf

      # A schema change that breaks the document fails here rather than at
      # publication. The narrative is hand-written; every layout and value
      # table in it is an include:: of generated content, so a renamed block
      # or a deleted enumeration surfaces as an unresolved include.
      - name: Build HTML and PDF
        run: spec/build_document.sh "$GITHUB_WORKSPACE/build/doc"

      - uses: actions/upload-artifact@v7
        with:
          name: ife-specification
          path: build/doc/

  wasm:
    name: emscripten (the residency branch)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16

      # src/IFE_Window.cpp holds the project's only __EMSCRIPTEN__ branch, and
      # no other job compiles it: every native build takes the other side of
      # the #if. Without this step the ranged-fetch path -- EM_ASYNC_JS body
      # included -- is never seen by a compiler at all.
      - name: Fetch dependencies (native)
        run: cmake -B build
      - name: Compile the Emscripten branch
        run: |
          emcc -std=c++20 -Werror -c src/IFE_Window.cpp \
            -I include -I src -I .deps/irisheaders-src/include -I .deps/irisheaders-src/priv \
            -o /tmp/ife_window_wasm.o

  big-endian:
    name: big-endian (s390x)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A cross compiler and user-mode QEMU on the host, with no container:
      # cmake/toolchains/s390x-linux-gnu.cmake names qemu-s390x as the
      # CMAKE_CROSSCOMPILING_EMULATOR, so ctest calls the emulator directly
      # and nothing depends on a binfmt_misc registration. The registration
      # docker/setup-qemu-action made did not hold on Blacksmith's runner VMs
      # and every s390x container failed with "exec format error"
      # (development/WBS.md, CI-2). Generation and the corpus fetch run at
      # configure on the host; only the test binaries are emulated.
      - name: Install the s390x cross compiler and QEMU user mode
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends g++-s390x-linux-gnu qemu-user ninja-build
      # The whole ctest suite under emulation, including the three suites that
      # touch bytes (bytes, blocks, window) and the v1 oracle, which reads
      # bytes the shipped encoder wrote on a host whose byte order is the
      # opposite of every machine either was developed on.
      # ife_host_byte_order_tests fails unless the binaries execute big-endian.
      - name: Configure, build and test on s390x
        run: cmake --workflow --preset big-endian
